# fly.toml app configuration file generated for bazel-remote-tender-starlight-8512 on 2026-05-21T16:07:54+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bazel-remote-tender-starlight-8512'
primary_region = 'lhr'

[build]
  image='quay.io/bazel-remote/bazel-remote:latest'

[env]
  BAZEL_REMOTE_MAX_SIZE=1

[mounts]
  source = "bazel_remote_data"
  destination = "/data"
  scheduled_snapshots = false

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
